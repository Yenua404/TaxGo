<div class="startup-splash" id="startup-splash" hidden aria-hidden="true">
  <div class="startup-logo">
    <span class="startup-wordmark">TaxGo</span>
    <span class="startup-mark">
      <svg class="startup-arrow" viewBox="0 0 24 24"><path d="M3 10 18.5 4 13 19l-2.4-6.2Z"/></svg>
      <svg class="ic startup-plane" viewBox="0 0 24 24"><use href="#i-plane"></use></svg>
      <span class="startup-sparks"><i></i><i></i><i></i></span>
    </span>
  </div>
</div>
<script>
  (function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var splash = document.getElementById('startup-splash');
    try {
      if (localStorage.getItem('taxgo-ui-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch (e) { /* 저장소를 사용할 수 없어도 시작 화면은 표시합니다. */ }
    splash.hidden = false;
    window.setTimeout(function () {
      if (splash.hidden) return;
      splash.hidden = true;
      var app = document.getElementById('app');
      if (app) app.inert = false;
    }, 5200);
  })();
</script>

<div class="app" id="app">
  <header class="top">
    <div class="top-row">
      <div class="brand" aria-label="TaxGo">
        <span class="brand-name disp">TaxGo</span><svg class="ic brand-plane" width="20" height="20" aria-hidden="true"><use href="#i-plane"></use></svg>
      </div>
      <div class="top-tools">
        <div class="languages" role="group" aria-label="언어 선택">
          <button type="button" data-act="language" data-arg="ko" lang="ko" data-key="lang-ko" aria-pressed="true">한국어</button>
          <button type="button" data-act="language" data-arg="ja" lang="ja" data-key="lang-ja" aria-pressed="false">日本語</button>
          <button type="button" data-act="language" data-arg="en" lang="en" data-key="lang-en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="theme-btn" data-act="theme" data-key="theme" aria-label="다크 모드 전환" title="다크 모드 전환"><svg class="ic theme-moon" width="20" height="20" aria-hidden="true"><use href="#i-moon"></use></svg><svg class="ic theme-sun" width="20" height="20" aria-hidden="true"><use href="#i-sun"></use></svg></button>
      </div>
    </div>
    <div class="top-sub">
      <span class="top-slogan">해외여행 세금환급 도우미</span>
      <button type="button" class="tripchip" id="tripchip" data-act="trip" data-key="tripchip">여행 정보</button>
    </div>
  </header>

  <div class="previewbar" id="previewbar" hidden>
    <span id="previewtext"></span>
    <button type="button" class="btn-text" data-act="preview" data-arg="auto">지금으로 돌아가기</button>
  </div>

  <main class="view" id="view" tabindex="-1">
    <noscript><p>이 앱은 자바스크립트를 켜야 쓸 수 있습니다.</p></noscript>
  </main>

  <nav class="tabs" aria-label="주요 메뉴">
    <a class="tab" href="#home" data-act="tab" data-arg="home"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-home"></use></svg><span>홈</span></a>
    <a class="tab" href="#receipts" data-act="tab" data-arg="receipts"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-receipt"></use></svg><span>영수증</span></a>
    <a class="tab tab-departure" href="#departure" data-act="tab" data-arg="departure"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-plane"></use></svg><span>출국</span></a>
    <a class="tab" href="#calendar" data-act="tab" data-arg="calendar"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-cal"></use></svg><span>캘린더</span></a>
    <a class="tab" href="#wallet" data-act="tab" data-arg="wallet"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-more"></use></svg><span>더보기</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<!-- 영수증 추가·수정: 금액은 '합계만 입력'과 '물품별 입력' 가운데 고릅니다 -->
<dialog id="dlg-receipt" aria-labelledby="dlg-receipt-title">
  <form class="sheet" id="form-receipt" novalidate>
    <div class="sheet-head">
      <h2 class="sheet-title disp" id="dlg-receipt-title">영수증 추가</h2>
      <button type="button" class="iconbtn" data-act="close" data-arg="dlg-receipt" aria-label="닫기"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-close"></use></svg></button>
    </div>
    <div class="field">
      <label for="r-store">매장 이름</label>
      <input class="input" id="r-store" name="store" type="text" maxlength="40" autocomplete="off" placeholder="예: 드럭스토어 텐진점">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="r-date">구매일</label>
        <input class="input" id="r-date" name="date" type="date">
      </div>
      <div class="field">
        <label for="r-rate">세율</label>
        <select class="input" id="r-rate" name="rate">
          <option value="10">10% 일반</option>
          <option value="8">8% 식품·음료</option>
        </select>
      </div>
    </div>
    <div class="field" id="r-items-field">
      <span class="label" id="r-items-label">물품 <span class="hint">금액은 세금 포함, 엔</span></span>
      <ul class="item-rows" id="r-items" aria-labelledby="r-items-label"></ul>
      <div class="item-foot">
        <button type="button" class="btn btn-line btn-sm" id="r-add-item" data-act="formAddItem"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="#i-plus"></use></svg>물품 추가</button>
        <span class="item-sum" id="r-items-sum" aria-live="polite"></span>
      </div>
    </div>
    <div class="calc" id="r-calc" aria-live="polite"></div>
    <div class="field-row">
      <div class="field">
        <label for="r-method">환급 방법</label>
        <select class="input" id="r-method" name="method"></select>
      </div>
      <div class="field">
        <label for="r-fee">환급 수수료 <span class="hint">있으면, 엔</span></label>
        <input class="input num" id="r-fee" name="fee" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
      </div>
    </div>
    <div class="sheet-end">
      <p class="form-msg" id="r-msg" role="alert"></p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-line" data-act="close" data-arg="dlg-receipt">취소</button>
        <button type="submit" class="btn btn-sign" id="r-submit">영수증 저장</button>
      </div>
    </div>
  </form>
</dialog>

<!-- 여행 정보 -->
<dialog id="dlg-trip" aria-labelledby="dlg-trip-title">
  <form class="sheet" id="form-trip" novalidate>
    <div class="sheet-head">
      <h2 class="sheet-title disp" id="dlg-trip-title">여행 정보</h2>
      <button type="button" class="iconbtn" data-act="close" data-arg="dlg-trip" aria-label="닫기"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-close"></use></svg></button>
    </div>
    <div class="field">
      <label for="t-airport">출국 공항·항구</label>
      <select class="input" id="t-airport" name="airport"></select>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="t-date">출국일</label>
        <input class="input" id="t-date" name="date" type="date">
      </div>
      <div class="field">
        <label for="t-time">출발 시각</label>
        <input class="input" id="t-time" name="time" type="time">
      </div>
    </div>
    <p class="form-msg" id="t-msg" role="alert"></p>
    <div class="sheet-actions">
      <button type="button" class="btn btn-line" data-act="close" data-arg="dlg-trip">취소</button>
      <button type="submit" class="btn btn-sign">여행 정보 저장</button>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn-text" data-act="resetSample">예시 데이터로 되돌리기</button>
    </div>
  </form>
</dialog>

<!-- 여권 카드: 사용자가 입력한 내용은 taxgo-v1과 분리하여 현재 탭 세션에만 표시합니다 -->
<dialog id="dlg-passport" aria-labelledby="dlg-passport-title">
  <form class="sheet" id="form-passport" novalidate>
    <div class="sheet-head">
      <h2 class="sheet-title disp" id="dlg-passport-title">여권 정보</h2>
      <button type="button" class="iconbtn" data-act="close" data-arg="dlg-passport" aria-label="닫기"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-close"></use></svg></button>
    </div>
    <p class="passport-privacy-note">이 정보는 현재 브라우저 탭에서만 임시 보관됩니다. 공용 기기에서는 입력하지 마세요. 실제 출국 시에는 여권 원본을 확인해야 합니다.</p>
    <div class="field"><label for="p-name">여권 영문 이름</label><input class="input" id="p-name" name="name" autocomplete="off" type="text" maxlength="70" placeholder="여권에 적힌 이름"></div>
    <div class="field"><label for="p-number">여권번호</label><input class="input" id="p-number" name="number" autocomplete="off" type="text" maxlength="30" placeholder="여권번호"></div>
    <div class="field"><label for="p-country">국적</label><input class="input" id="p-country" name="country" autocomplete="off" type="text" maxlength="50" placeholder="대한민국"></div>
    <div class="field"><label for="p-expires">만료일</label><input class="input" id="p-expires" name="expires" type="date"></div>
    <div class="sheet-actions"><button type="button" class="btn btn-line" data-act="close" data-arg="dlg-passport">취소</button><button class="btn btn-sign" type="submit">정보 표시</button></div>
  </form>
</dialog>

<!-- 출국 체크리스트: 마스코트로 열 수 있는 접이식 팝업 -->
<dialog id="dlg-checklist" class="checklist-dialog" aria-labelledby="dlg-checklist-title">
  <div class="sheet checklist-sheet">
    <div class="sheet-head"><h2 class="sheet-title disp" id="dlg-checklist-title">출국 체크리스트</h2>
      <button type="button" class="iconbtn" data-act="close" data-arg="dlg-checklist" aria-label="닫기"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-close"></use></svg></button>
    </div>
    <div id="checklist-content"></div>
    <button type="button" class="clear-celebration" id="clear-celebration" data-act="dismissClear" hidden>
      <span class="clear-stage"><span id="clear-particles" aria-hidden="true"></span><svg class="mascot-art clear-mascot" viewBox="0 0 156 164" aria-hidden="true"><use href="#i-mascot-happy"></use></svg><strong class="clear-word">CLEAR!</strong><span id="clear-message" role="status"></span></span>
    </button>
    <button type="button" class="btn btn-sign btn-block" data-act="close" data-arg="dlg-checklist">체크리스트 닫기</button>
  </div>
</dialog>

<!-- 알림마다 지정일과 반복 주기를 저장합니다. -->
<dialog id="dlg-reminder" aria-labelledby="dlg-reminder-title">
  <form class="sheet" id="form-reminder" novalidate>
    <div class="sheet-head"><h2 class="sheet-title disp" id="dlg-reminder-title">알림 일정 수정</h2>
      <button type="button" class="iconbtn" data-act="close" data-arg="dlg-reminder" aria-label="닫기"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-close"></use></svg></button>
    </div>
    <p class="lede" id="rem-description">자동 설정을 선택하면 출국일에 맞춰 계산합니다.</p>
    <div class="field"><label for="rem-mode">알림 설정</label>
      <select class="input" id="rem-mode" name="mode">
        <option value="auto">자동 설정 (기본)</option>
        <option value="once">지정 날짜에 한 번</option>
        <option value="weekly">지정일부터 매주 반복</option>
        <option value="monthly">지정일부터 매월 반복</option>
        <option value="daily">지정한 기한까지 매일 반복</option>
      </select></div>
    <div class="field" id="rem-date-field" hidden><label for="rem-date" id="rem-date-label">날짜 선택</label>
      <input class="input" type="date" id="rem-date" name="date"></div>
    <div class="field" id="rem-until-field" hidden><label for="rem-until" id="rem-until-label">반복 종료일</label>
      <input class="input" type="date" id="rem-until" name="until"></div>
    <p id="rem-error" class="form-msg" role="alert"></p>
    <div class="sheet-actions"><button type="button" class="btn btn-line" data-act="close" data-arg="dlg-reminder">취소</button><button type="submit" class="btn btn-sign">알림 저장</button></div>
  </form>
</dialog>
<dialog id="dlg-memo" aria-labelledby="memo-title">
  <form class="sheet" id="form-memo" novalidate>
    <div class="sheet-head"><h2 class="sheet-title disp" id="memo-title">일정 메모</h2><button type="button" class="iconbtn" id="memo-close" data-act="close" data-arg="dlg-memo" aria-label="닫기"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-close"></use></svg></button></div>
    <div class="field"><label id="memo-date-label" for="memo-date">날짜</label><input class="input" id="memo-date" type="date" required></div>
    <div class="field"><label id="memo-text-label" for="memo-text">메모</label><textarea class="input memo-textarea" id="memo-text" maxlength="300" rows="4" required></textarea></div>
    <p id="memo-error" class="form-msg" role="alert"></p>
    <button class="btn btn-line btn-sm memo-delete" type="button" id="memo-delete" data-act="memoDelete" hidden>메모 삭제</button>
    <div class="sheet-actions"><button type="button" class="btn btn-line" id="memo-cancel" data-act="close" data-arg="dlg-memo">취소</button><button type="submit" class="btn btn-sign" id="memo-save">저장</button></div>
  </form>
</dialog>
<dialog id="dlg-arrival" aria-labelledby="dlg-arrival-title">
  <div class="sheet">
    <div class="sheet-head"><h2 class="sheet-title disp" id="dlg-arrival-title"></h2>
      <button type="button" class="iconbtn" id="arrival-close" data-act="close" data-arg="dlg-arrival"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-close"></use></svg></button>
    </div>
    <div id="arrival-content"></div>
  </div>
</dialog>
<dialog id="dlg-wallet-qr" aria-labelledby="dlg-wallet-qr-title">
  <div class="sheet">
    <div class="sheet-head"><h2 class="sheet-title disp" id="dlg-wallet-qr-title"></h2>
      <button type="button" class="iconbtn" id="wallet-qr-close" data-act="close" data-arg="dlg-wallet-qr"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-close"></use></svg></button>
    </div>
    <div id="wallet-qr-content"></div>
    <p id="wallet-qr-status" role="status" aria-live="polite"></p>
    <input type="file" id="qr-image-input" accept="image/png,image/jpeg,image/webp,image/bmp,image/gif" class="sr" aria-label="QR 이미지 선택">
  </div>
</dialog>

<script src="data.js"></script>
<script src="logic.js"></script>
<script src="locales.js"></script>
<script src="reminders.js"></script>
<script src="detail-locales.js"></script>
<script src="pick-data.js"></script>
<script src="pick-art.js"></script>
<script src="pick-scene.js"></script>
<script src="quiz-data.js"></script>
<script src="quiz-art.js"></script>
<script src="app.js"></script>
</body>
</html>
