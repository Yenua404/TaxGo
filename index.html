  }

  /* ---------- 화면: 홈 ---------- */
  function remRow(r, past) {
    return '<li class="row' + (past ? ' is-past' : '') + '"><span class="row-when">' + esc(mdw(L.toISO(r.at))) + '<br>' + hm(r.at) + (past ? ' 지남' : '') + '</span>' +
      '<span class="row-main"><span class="row-title">' + nb(r.title) + '</span><span class="row-desc">' + nb(r.body) + '</span></span></li>';
  }

  function riskWhy(list) {
    var consumed = list.some(function (x) { return x.v.status === 'consumed'; });
    var late = list.some(function (x) { return x.v.status === 'late'; });
    return (consumed ? '먹었거나 없는 물건이 있습니다. 공항에서 키오스크 대신 세관 직원에게 먼저 말하세요.' : '') +
      (consumed && late ? ' ' : '') +
      (late ? '출국일이 출국 기한보다 늦은 영수증이 있습니다.' : '');
  }

  function viewHome(c) {
    var P = D.phases[c.phase];
    var s = c.sum;
    var h = [];

    if (state.sample) {
      h.push('<div class="sample"><span>예시 여행으로 둘러보는 중입니다.</span>' +
        '<button type="button" class="btn-text" data-act="startMine" data-key="startMine">내 여행으로 시작</button></div>');
    }

    /* 안내판: 지금 시점에 할 일 하나 */
    h.push('<section class="board' + (ui.flip ? ' is-flip' : '') + '" aria-labelledby="board-title">' +
      '<div class="board-top"><span class="chip chip-sign">' + esc(P.chip) + '</span>' +
      (c.dlabel ? '<span class="dday disp">' + esc(c.dlabel) + '</span>' : '') + '</div>' +
      '<div class="board-main"><span class="picto">' + icon(P.picto, 30) + '</span>' +
      '<div class="board-copy"><h1 class="board-title disp" id="board-title">' + esc(P.title) + '</h1>' +
      '<p class="board-body">' + esc(P.body) + '</p>' +
      (c.phase === 'day' ? '<p class="board-where">' + icon('pin', 18) + '<span>' + nb(c.airport.kiosk) + '</span></p>' : '') +
      '</div></div>' +
      (c.trip.depDate
        ? '<div class="board-trip"><div><b>' + esc(c.airport.name) + '</b><span>' + esc(mdw(c.trip.depDate) + ' ' + c.trip.depTime) + ' 출발</span></div>' +
          '<button type="button" class="iconbtn iconbtn-action" data-act="trip" data-key="board-trip" aria-label="여행 정보 변경" title="여행 정보 변경">' + icon('pen', 20) + '</button></div>'
        : '') +
      '<button type="button" class="btn btn-sign btn-block" data-act="' + P.act + '" data-arg="' + (P.arg || '') + '" data-key="board-cta">' + esc(P.cta) + '</button>' +
      '</section>');

    /* 돌려받을 세금 */
    h.push('<section class="sec" aria-labelledby="h-refund"><div class="sec-head"><h2 class="sec-title disp" id="h-refund">돌려받을 세금</h2>' +
      (s.count ? '<a class="link" href="#receipts" data-act="tab" data-arg="receipts">영수증 ' + s.count + '장 보기</a>' : '') + '</div>');
    if (!s.count) {
      h.push('<div class="panel"><p>아직 영수증이 없습니다. 면세로 산 영수증을 추가하면 환급액과 출국 기한을 계산해 드립니다.</p>' +
        '<button type="button" class="btn btn-line" data-act="add" data-key="home-add">' + icon('plus', 18) + '영수증 추가</button></div>');
    } else {
      var risky = c.views.filter(function (x) { return x.v.status === 'consumed' || x.v.status === 'late'; });
      h.push('<div class="panel">' +
        '<div class="money-row"><span class="money">' + yen(s.refund) + '</span><span class="money-note">예상 금액입니다. 매장에 따라 수수료가 빠질 수 있습니다.</span></div>' +
        (s.refund + s.risk > 0
          ? '<div class="bar" role="img" aria-label="환급 가능 ' + yen(s.refund) + ', 환급 불가 위험 ' + yen(s.risk) + '">' +
            (s.refund ? '<span class="bar-go" style="flex:' + s.refund + ' 1 0"></span>' : '') +
            (s.risk ? '<span class="bar-risk" style="flex:' + s.risk + ' 1 0"></span>' : '') + '</div>'
          : '') +
        '<ul class="legend"><li><span class="key key-go"></span>환급 가능 ' + s.okCount + '장<b>' + yen(s.refund) + '</b></li>' +
        (s.riskCount ? '<li><span class="key key-risk"></span>환급 불가 위험 ' + s.riskCount + '장<b>' + yen(s.risk) + '</b></li>' : '') + '</ul>' +
        (risky.length
          ? '<p class="note note-risk">' + icon('warn', 20) + '<span><span class="note-title">' + esc(risky.map(function (x) { return x.r.store; }).join(', ')) + '</span>' + riskWhy(risky) + '</span></p>'
          : '') +
        '</div>');
    }
    h.push('</section>');

    /* 다가오는 일정 */
    var upcoming = c.rem.filter(function (r) { return r.at.getTime() >= c.now.getTime(); }).slice(0, 3);
    h.push('<section class="sec" aria-labelledby="h-next"><div class="sec-head"><h2 class="sec-title disp" id="h-next">다가오는 일정</h2>' +
      '<a class="link" href="#calendar" data-act="tab" data-arg="calendar">캘린더 보기</a></div>' +
      (upcoming.length
        ? '<ul class="rows">' + upcoming.map(function (r) { return remRow(r, false); }).join('') + '</ul>'
        : '<div class="panel"><p>' + (c.trip.depDate ? '남은 일정이 없습니다.' : '출국일을 입력하면 일정을 계산합니다.') + '</p></div>') +
      '</section>');

    /* 시점 미리보기 (테스트용) */
    if (c.trip.depDate) {
      h.push('<section class="sec" aria-labelledby="h-preview"><div class="sec-head"><h2 class="sec-title disp" id="h-preview">시점 미리보기</h2></div>' +
        '<p class="lede">테스트용 화면입니다. 여행 시점을 바꿔서 확인할 수 있습니다.</p>' +
        '<div class="seg" role="group" aria-labelledby="h-preview">' + PREVIEWS.map(function (p) {
          return '<button type="button" data-act="preview" data-arg="' + p[0] + '" data-key="pv-' + p[0] + '" aria-pressed="' + (ui.preview === p[0]) + '">' + p[1] + '</button>';
        }).join('') + '</div></section>');
    }
    return h.join('');
  }

  /* ---------- 화면: 영수증 ---------- */
  function line(k, v) { return '<div><dt>' + k + '</dt><dd>' + v + '</dd></div>'; }

  /* 물품별로 입력한 영수증의 물품 한 줄. 체크하면 '먹었거나 써서 없음' */
  function itemRow(r, it) {
    var key = 'used-' + r.id + '-' + it.id;
    return '<li><label class="item" for="' + key + '">' +
      '<input type="checkbox" id="' + key + '" data-change="itemUsed" data-arg="' + r.id + ':' + it.id + '" data-key="' + key + '"' + (it.used ? ' checked' : '') + '>' +
      '<span class="item-name"><span class="sr">먹었거나 써서 없음: </span><span class="item-text">' + esc(it.name) + '</span>' +
      (it.used ? '<span class="chip chip-risk">소비</span>' : '') + '</span>' +
      '<span class="item-price">' + yen(it.price) + '</span></label></li>';
  }

  function slip(r, v, c) {
    var ok = v.status === 'ok';
    var itemized = r.mode === 'items';
    var left = L.diffDays(c.todayISO, v.due);
    var msg = v.status === 'consumed' ? '먹었거나 없는 물건이 있어서 이 영수증은 통째로 환급이 안 됩니다. 공항에서는 키오스크 대신 세관 직원에게 먼저 말하세요.'
      : v.status === 'late' ? '출국일이 이 영수증의 출국 기한보다 늦습니다. 기한 안에 출국해야 환급받을 수 있습니다.'
      : v.status === 'under' ? '세전 ' + yen(D.rules.minPreTax) + ' 미만이라 면세 대상이 아닙니다.'
      : '';
    return '<article class="slip-wrap" aria-label="' + esc(r.store) + ' 영수증"><div class="slip">' +
      '<div class="slip-head"><div><h2 class="slip-store">' + esc(r.store) + '</h2><p class="slip-date">' + esc(mdw(r.date)) + ' 구매' + (itemized ? ', 물품 ' + v.count + '개' : '') + '</p></div>' +
      '<span class="stamp disp ' + (ok ? 'is-ok' : 'is-no') + '">' + (ok ? '환급 가능' : '환급 불가') + '</span></div>' +
      (itemized
        ? '<div class="items"><p class="items-head" id="items-' + r.id + '">먹었거나 쓴 물건에 체크하세요</p>' +
          '<ul aria-labelledby="items-' + r.id + '">' + r.items.map(function (it) { return itemRow(r, it); }).join('') + '</ul></div>'
        : '') +
      '<dl class="slip-lines">' +
      line('결제 금액', yen(v.total)) +
      line('세전 금액', yen(v.pre)) +
      (v.fee ? line('환급 수수료', '−' + yen(v.fee)) : '') +
      line('환급 방법', esc(methodLabel(r.method))) +
      line('출국 기한', ymd(v.due) + (left >= 0 ? ' (D-' + left + ')' : ' (지남)')) +
      '<div class="is-total' + (ok ? '' : ' is-void') + '"><dt>환급 예상</dt><dd>' + yen(v.net) + '</dd></div>' +
      '</dl>' +
      (msg ? '<p class="slip-msg">' + msg + '</p>' : '') +
      '<div class="slip-actions">' +
      (itemized
        ? '<span class="slip-count">' + (v.used ? '물품 ' + v.count + '개 가운데 ' + v.used + '개 소비' : '소비한 물건 없음') + '</span>'
        : '<button type="button" class="btn btn-line btn-sm" data-act="consume" data-arg="' + r.id + '" data-key="consume-' + r.id + '" aria-pressed="' + !!r.consumed + '">' +
          (r.consumed ? icon('check', 18) : '') + '물건 소비</button>') +
      '<span class="slip-tools">' +
      '<button type="button" class="iconbtn iconbtn-action" data-act="edit" data-arg="' + r.id + '" data-key="edit-' + r.id + '" aria-label="영수증 수정" title="영수증 수정">' + icon('pen', 20) + '</button>' +
      '<button type="button" class="iconbtn iconbtn-action is-danger" data-act="del" data-arg="' + r.id + '" data-key="del-' + r.id + '" aria-label="영수증 삭제" title="영수증 삭제">' + icon('trash', 20) + '</button>' +
      '</span></div></div></article>';
  }

  function viewReceipts(c) {
    var h = [];
    h.push('<div class="page-head"><div class="page-head-row"><h1 class="page-title disp">영수증</h1>' +
      '<button type="button" class="btn btn-sign btn-sm" data-act="add" data-key="rc-add">' + icon('plus', 18) + '영수증 추가</button></div>' +
      '<p class="lede">세관은 영수증 한 장을 한 묶음으로 확인합니다. 한 장에서 하나라도 없으면 그 영수증 전체를 환급받을 수 없습니다.</p></div>');
    if (!c.views.length) {
      h.push('<div class="panel"><p>아직 영수증이 없습니다. 면세로 살 때마다 추가해 두면 환급액과 출국 기한을 계산해 드립니다.</p></div>');
    } else {
      h.push('<div class="slips">' + c.views.map(function (x) { return slip(x.r, x.v, c); }).join('') + '</div>');
    }
    return h.join('');
  }

  /* ---------- 화면: 캘린더 ---------- */
  function eventsByDay(c) {
    var map = {};
    function add(iso, kind, text) { (map[iso] = map[iso] || []).push({ kind: kind, text: text }); }
    c.views.forEach(function (x) {
      add(x.r.date, 'buy', '구매: ' + x.r.store + ' ' + yen(x.v.total));
      if (x.v.status === 'ok' || x.v.status === 'late') add(x.v.due, 'due', '출국 기한: ' + x.r.store + ' 구매분');
    });
    if (c.trip.depDate) add(c.trip.depDate, 'dep', '출국: ' + c.trip.depTime + ' ' + c.airport.name);
    c.rem.forEach(function (r) { add(L.toISO(r.at), 'remind', '알림 ' + hm(r.at) + ' ' + r.title); });
    return map;
  }

  function viewCalendar(c) {
    var month = ui.calMonth || c.todayISO.slice(0, 7);
    var y = +month.slice(0, 4);
    var m = +month.slice(5, 7);
    var lead = new Date(y, m - 1, 1, 12).getDay();
    var days = new Date(y, m, 0).getDate();
    var ev = eventsByDay(c);
    var selected = ui.calDay || (c.todayISO.slice(0, 7) === month ? c.todayISO : '');
    var cells = [];
    var i;
    var d;

    for (i = 0; i < lead; i++) cells.push('<span></span>');
    for (d = 1; d <= days; d++) {
      var iso = month + '-' + L.pad(d);
      var list = ev[iso] || [];
      var kinds = {};
      for (i = 0; i < list.length; i++) kinds[list[i].kind] = true;
      var marks = '';
      if (kinds.buy) marks += '<i class="mk mk-buy"></i>';
      if (kinds.remind) marks += '<i class="mk mk-remind"></i>';
      if (kinds.due) marks += '<i class="mk mk-due"></i>';
      var label = m + '월 ' + d + '일 ' + WEEK[(lead + d - 1) % 7] + '요일' + (iso === c.todayISO ? ', 오늘' : '') + (list.length ? ', 일정 ' + list.length + '개' : '');
      cells.push('<button type="button" class="day' + (kinds.dep ? ' is-dep' : '') + (iso === c.todayISO ? ' is-today' : '') + '" data-act="calDay" data-arg="' + iso + '" data-key="day-' + iso + '" aria-pressed="' + (iso === selected) + '" aria-label="' + label + '">' +
        '<span class="day-num">' + d + '</span><span class="marks">' + marks + '</span></button>');
    }

    var info;
    if (!selected) {
      info = '<p class="lede">날짜를 누르면 그날 일정을 볼 수 있습니다.</p>';
    } else {
      var sel = ev[selected] || [];
      info = '<div class="panel"><h2 class="dayinfo-title">' + esc(mdw(selected)) + (selected === c.todayISO ? ' 오늘' : '') + '</h2>' +
        (sel.length
          ? '<ul class="dayinfo-list">' + sel.map(function (e) { return '<li><i class="mk mk-' + e.kind + '"></i><span>' + esc(e.text) + '</span></li>'; }).join('') + '</ul>'
          : '<p class="lede">이날은 면세 일정이 없습니다.</p>') +
        '</div>';
    }

    var due = c.sum.earliestDue;
    var dueLeft = due ? L.diffDays(c.todayISO, due) : 0;
    var h = [];
    h.push('<div class="page-head"><h1 class="page-title disp">캘린더</h1><p class="lede">구매일, 출국일, 90일 출국 기한을 한눈에 볼 수 있습니다.</p></div>');
    h.push('<section class="sec" aria-label="달력"><div class="cal">' +
      '<div class="cal-nav"><button type="button" class="iconbtn" data-act="calPrev" data-key="cal-prev" aria-label="이전 달">' + icon('left') + '</button>' +
      '<h2 class="cal-month disp">' + y + '년 ' + m + '월</h2>' +
      '<button type="button" class="iconbtn" data-act="calNext" data-key="cal-next" aria-label="다음 달">' + icon('right') + '</button></div>' +
      '<div class="cal-dow" aria-hidden="true">' + WEEK.map(function (w) { return '<span>' + w + '</span>'; }).join('') + '</div>' +
      '<div class="cal-grid">' + cells.join('') + '</div>' +
      '<ul class="cal-legend"><li><i class="mk mk-buy"></i>구매</li><li><i class="mk mk-dep"></i>출국일</li><li><i class="mk mk-remind"></i>알림</li><li><i class="mk mk-due"></i>출국 기한</li></ul>' +
      '</div>' + info + '</section>');

    h.push('<section class="sec" aria-labelledby="h-due"><div class="sec-head"><h2 class="sec-title disp" id="h-due">90일 출국 기한</h2></div>' +
      (due
        ? '<div class="panel"><div class="money-row"><span class="money disp">' + ymd(due) + '</span><span class="chip chip-sign">' + (dueLeft >= 0 ? 'D-' + dueLeft : '지남') + '</span></div>' +
          '<p class="lede">가장 먼저 산 영수증 기준입니다. 구매 다음 날부터 세어 90일째까지 출국해야 환급받을 수 있습니다.</p>' +
          '<button type="button" class="btn btn-line btn-sm" data-act="calGo" data-arg="' + due + '" data-key="cal-go">기한 날짜 보기</button></div>'
        : '<div class="panel"><p>영수증을 추가하면 출국 기한을 계산합니다.</p></div>') +
      '</section>');

    h.push('<section class="sec" aria-labelledby="h-rem"><div class="sec-head"><h2 class="sec-title disp" id="h-rem">알림 일정</h2></div>');
    if (c.rem.length) {
      h.push('<ul class="rows">' + c.rem.map(function (r) { return remRow(r, r.at.getTime() < c.now.getTime()); }).join('') + '</ul>' +
        (ui.embedded
          ? '<button type="button" class="btn btn-line" data-act="exportRem" data-key="export">' + icon('copy', 18) + '알림 일정 복사</button>'
          : '<button type="button" class="btn btn-line" data-act="exportRem" data-key="export">' + icon('cal', 18) + '캘린더 파일로 저장</button>' +
            '<p class="lede">저장한 파일을 열어 휴대폰 캘린더에 추가하면 앱을 닫아도 그 시각에 알림이 울립니다.</p>'));
    } else {
      h.push('<div class="panel"><p>출국일을 입력하면 알림 일정을 계산합니다.</p></div>');
    }
    h.push('</section>');
    return h.join('');
  }

  /* ---------- 화면: 출국 ---------- */
  /* 키오스크 안내판 안의 안내 한 덩어리.
     제목 줄(아이콘, 이름, 상태 칩) → 한 줄 답 → 시간·대수 칩 → 덧붙임 문장 순서로 쌓아서
     문장 하나에 장소, 시간, 조건이 뒤섞이지 않게 합니다. */
  function infoBlock(ic, label, raw, status) {
    var p = L.splitInfo(raw);
    return '<li class="info"><div class="info-head">' + icon(ic, 20) + '<h3 class="info-label">' + esc(label) + '</h3>' +
      (status ? '<span class="chip chip-ok">' + esc(status) + '</span>' : '') + '</div>' +
      '<p class="info-main">' + nb(p.text) + '</p>' +
      (p.meta.length ? '<ul class="info-meta">' + p.meta.map(function (t) { return '<li class="chip chip-dark">' + nb(t) + '</li>'; }).join('') + '</ul>' : '') +
      (p.extra ? '<p class="info-extra">' + nb(p.extra) + '</p>' : '') +
      '</li>';
  }

  /* 안내판 칩 글자: 숫자가 있는 값은 '키오스크 12대', '운영 06:00–21:00'처럼,
     모르는 값은 '운영 시간: 공항 안내 확인'처럼 무엇을 확인하라는 건지 이름을 붙입니다 */
  function specChip(label, longLabel, v) {
    return /\d/.test(v) ? label + ' ' + v : longLabel + ': ' + v;
  }

  function timeBlock(cls, label, d, extra) {
    return '<div class="time ' + cls + '"><span class="time-label">' + label + '</span>' +
      '<span class="time-num disp">' + hm(d) + '</span>' +
      '<span class="time-date">' + esc(mdw(L.toISO(d))) + (extra || '') + '</span></div>';
  }

  /* 공항 도착 목표를 왜 그 시간으로 잡았는지 */
  function planNotes(p, a) {
    var rows = [];
    var h = '';
    if (p.auto) {
      rows.push(['기본', '보통은 출발 ' + A.baseHours + '시간 전을 권합니다.', false]);
      if (p.busy) rows.push(['+1시간', (p.busy === 'weekend' ? '주말 출발이라' : esc(p.busy) + ' 기간이라') + ' 공항이 붐빌 수 있습니다.', true]);
      if (p.many) rows.push(['+1시간', (p.receipts >= A.manyReceipts ? '면세 영수증이 ' + p.receipts + '장이라' : '면세품이 ' + p.items + '개라') + ' 세관 확인에 시간이 더 걸릴 수 있습니다.', true]);
      h += '<ul class="why">' + rows.map(function (r) {
        return '<li><span class="why-tag' + (r[2] ? ' is-add' : '') + '">' + r[0] + '</span><span>' + r[1] + '</span></li>';
      }).join('') + '</ul>';
      if (!p.busy && !p.many) {
        h += '<p class="lede">주말이나 일본 연휴에 출발하거나 면세품이 많으면 1시간씩, 최대 ' + A.maxHours + '시간 전까지 자동으로 앞당깁니다.</p>';
      }
    } else {
      h += '<p class="lede">직접 고른 시간입니다. 자동을 누르면 출국일과 면세품 수에 맞춰 계산됩니다.</p>';
    }
    if (p.clamped) {
      h += '<p class="note note-sign">' + icon('warn', 20) + '<span><span class="note-title">키오스크가 ' + esc(a.open) + '에 엽니다</span>더 일찍 가도 면세 절차를 시작할 수 없어서, 목표를 키오스크가 여는 시각에 맞췄습니다.</span></p>';
    } else if (p.hours > A.baseHours) {
      h += '<p class="lede">체크인 카운터는 보통 출발 2~3시간 전에 엽니다.</p>';
    }
    return h;
  }

  function viewDeparture(c) {
    var a = c.airport;
    var p = c.plan;
    var h = [];
    var done = 0;

    h.push('<div class="page-head"><h1 class="page-title disp">출국</h1><p class="lede">짐을 맡기기 전에 키오스크부터 가세요.</p></div>');

    h.push('<div class="field airport-field"><label for="dep-airport">출국 공항·항구</label>' +
      '<select class="input" id="dep-airport" data-change="airport" data-key="dep-airport">' +
      D.airports.map(function (x) { return '<option value="' + x.id + '"' + (x.id === a.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') +
      '</select></div>');

    /* 출발 시각과 공항 도착 목표 */
    h.push('<section class="sec" aria-labelledby="h-times"><div class="sec-head"><h2 class="sec-title disp" id="h-times">공항 도착 목표</h2>' +
      '<button type="button" class="btn-text" data-act="trip" data-key="dep-trip">' + (p ? '출발 시각 변경' : '여행 정보 입력') + '</button></div>');
    if (!p) {
      h.push('<div class="panel"><p>출국일과 출발 시각을 입력하면 공항에 언제까지 도착하면 좋은지 계산합니다.</p></div>');
    } else {
      var leads = [[0, '자동']];
      for (var hh = A.baseHours; hh <= A.maxHours; hh++) leads.push([hh, hh + '시간 전']);
      h.push('<div class="panel">' +
        '<div class="times">' +
        timeBlock('is-goal', '<span class="chip chip-sign">공항 도착 목표</span>', p.at, '<span class="sr">, 출발 ' + span(p.leadMin) + ' 전</span>') +
        '<div class="time-gap" aria-hidden="true"><span>' + span(p.leadMin) + '</span><i></i></div>' +
        timeBlock('is-dep', a.ship ? '배 출발' : '비행기 출발', p.dep, '') +
        '</div>' +
        '<div class="seg" role="group" aria-label="공항 도착 목표 정하기">' + leads.map(function (x) {
          return '<button type="button" data-act="lead" data-arg="' + x[0] + '" data-key="lead-' + x[0] + '" aria-pressed="' + ((c.trip.lead || 0) === x[0]) + '">' + x[1] + '</button>';
        }).join('') + '</div>' +
        planNotes(p, a) +
        '</div>');
    }
    h.push('</section>');

    /* 키오스크 위치 안내판: 아래 안내는 휴대폰 판정 → RED일 때 → 현금 환급 순서로 한 덩어리씩 */
    var spec = a.hours === a.count
      ? [specChip('', '대수·운영 시간', a.count)]
      : [specChip('키오스크', '키오스크 대수', a.count), specChip('운영', '운영 시간', a.hours)];
    h.push('<section class="board" aria-label="면세 키오스크 위치">' +
      '<div class="kiosk-sign"><span class="picto">' + icon('kiosk', 30) + '</span>' +
      '<div><p class="kiosk-ja" lang="ja">免税手続 TAX REFUND</p><p class="kiosk-ko">면세 절차 키오스크</p></div></div>' +
      '<p class="kiosk-where disp">' + nb(a.kiosk) + '</p>' +
      '<ul class="kiosk-spec" aria-label="키오스크 대수와 운영 시간">' + spec.map(function (t) { return '<li class="chip chip-dark">' + nb(t) + '</li>'; }).join('') + '</ul>' +
      '<ul class="infos">' +
      (a.vjw ? infoBlock('wifi', '휴대폰 판정', '출발 로비의 전용 Wi-Fi에서 Visit Japan Web으로', '가능') : '') +
      infoBlock('search', 'RED일 때', a.red) +
      infoBlock('yen', '현금 환급', a.cash) +
      '</ul>' +
      (a.note ? '<p class="board-note"><b>참고</b>' + nb(a.note) + '</p>' : '') +
      '<a class="board-src" href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">출처: ' + esc(a.src) + ', ' + esc(D.checkedAt) + ' 확인' + icon('ext', 14) + '</a>' +
      '</section>');

    var bad = c.views.filter(function (x) { return x.v.status === 'consumed'; });
    if (bad.length) {
      h.push('<p class="note note-risk">' + icon('warn', 20) + '<span><span class="note-title">세관 직원에게 먼저 말할 영수증 ' + bad.length + '장</span>' +
        esc(bad.map(function (x) { return x.r.store; }).join(', ')) + '에 먹었거나 없는 물건이 있습니다. 키오스크 대신 세관 직원에게 먼저 말하세요.</span></p>');
    }

    /* 아래 세 가지(체크리스트, 키오스크 결과, 표지판)는 부가 메뉴로 하나씩만 보여 줍니다 */
    var panels = {};

    /* 체크리스트 */
    var arriveText = p
      ? hm(p.at) + '까지 공항에 도착합니다. 출발 ' + span(p.leadMin) + ' 전입니다.'
      : '출발 ' + A.baseHours + '시간 전을 목표로 여유 있게 도착합니다.';
    var steps = D.checklist.map(function (st, i) {
      var on = !!state.checks[i];
      if (on) done += 1;
      var desc = fill(st.desc, {
        arrive: arriveText,
        kiosk: a.kiosk + (a.vjw ? '. 붐비면 Visit Japan Web으로도 됩니다.' : ''),
        red: a.red,
        cash: a.cash
      });
      return '<li class="step"><input type="checkbox" id="chk-' + i + '" data-change="check" data-arg="' + i + '" data-key="chk-' + i + '"' + (on ? ' checked' : '') + '>' +
        '<label for="chk-' + i + '"><span class="step-title"><span class="step-name">' + esc(st.title) + '</span>' +
        (st.key ? '<span class="chip chip-sign">핵심</span>' : '') +
        (st.only ? '<span class="chip chip-ghost">' + esc(st.only) + '</span>' : '') +
        '</span><span class="step-desc">' + nb(desc) + '</span></label></li>';
    });
    panels.steps = ('<section class="sec" aria-label="출국일 체크리스트"><div class="sec-head is-end">' +
      '<span class="sec-side num">' + done + '/' + D.checklist.length + ' 완료</span></div>' +
      '<ol class="steps">' + steps.join('') + '</ol>' +
      (done ? '<button type="button" class="btn-text" data-act="clearChecks" data-key="clear-checks">체크 모두 지우기</button>' : '') +
      '</section>');

    /* 키오스크 결과: GREEN과 RED를 함께 보여 줍니다 */
    panels.result = ('<section class="sec" aria-label="키오스크 결과">' +
      '<div class="result result-green">' + icon('check', 26) + '<p><b>GREEN이 나오면 세관 확인 끝</b><span>바로 체크인하러 가세요. 환급은 구매한 매장(환급 대행사)이 진행합니다.</span></p></div>' +
      '<div class="result result-red">' + icon('search', 26) + '<p><b>RED가 나오면 세관 확인</b><span>' + nb(a.red) + '</span><span>확인이 끝나면 체크인하세요.</span></p></div>' +
      '</section>');

    /* 표지판 일본어 */
    panels.signs = ('<section class="sec" aria-label="공항 표지판 읽기">' +
      '<ul class="signs">' + D.signs.map(function (w) {
        return '<li class="signword"><span class="signword-ja" lang="ja">' + esc(w.ja) + '</span><span class="signword-yomi" lang="ja">' + esc(w.yomi) + '</span>' +
          '<span class="signword-ko">' + esc(w.ko) + '</span><span class="signword-hun">' + esc(w.hun) + '</span></li>';
      }).join('') + '</ul></section>');

    /* 부가 메뉴: 누른 항목 하나만 아래에 펼쳐요 */
    h.push('<div class="sec">' +
      '<div class="seg seg-sub" role="group" aria-label="출국 부가 메뉴">' + DEP_TABS.map(function (x) {
        return '<button type="button" data-act="depTab" data-arg="' + x[0] + '" data-key="dep-sub-' + x[0] + '" aria-pressed="' + (ui.depTab === x[0]) + '">' + x[1] + '</button>';
      }).join('') + '</div>' +
      (panels[ui.depTab] || panels.steps) + '</div>');

    return h.join('');
  }

  /* ---------- 화면: 가이드 ---------- */

  /* 면세 QR 만들기 안내판: Visit Japan Web 바로가기 */
  function qrBoard() {
    var q = D.qr;
    return '<section class="board qr" aria-labelledby="h-qr">' +
      '<div class="kiosk-sign"><span class="picto">' + icon('qr', 30) + '</span>' +
      '<div><h3 class="qr-title disp" id="h-qr">' + esc(q.title) + '</h3><p class="kiosk-ko">' + esc(q.sub) + '</p></div></div>' +
      '<ol class="qr-steps">' + q.steps.map(function (s) { return '<li><span>' + nb(s) + '</span></li>'; }).join('') + '</ol>' +
      '<a class="btn btn-sign btn-block" href="' + esc(q.url) + '" target="_blank" rel="noopener noreferrer" data-key="qr-cta">' + esc(q.cta) + icon('ext', 18) + '</a>' +
      '<p class="qr-host">' + esc(q.host) + '</p>' +
      '<ul class="qr-notes">' + q.notes.map(function (n) { return '<li>' + nb(n) + '</li>'; }).join('') + '</ul>' +
      '</section>';
  }

  function viewGuide() {
    var g = D.guide[ui.guideStep] || D.guide[0];
    var next = D.guide[ui.guideStep + 1];
    var h = [];

    h.push('<div class="page-head"><h1 class="page-title disp">절차 가이드</h1>' +
      '<p class="lede">2026년 11월 1일 구매분부터는 살 때 세금까지 내고, 출국할 때 확인을 받은 뒤 돌려받습니다.</p></div>');

    h.push('<section class="sec" aria-labelledby="h-guide">' +
      '<div class="seg" role="group" aria-label="절차 단계">' + D.guide.map(function (x, i) {
        return '<button type="button" data-act="guide" data-arg="' + i + '" data-key="guide-' + i + '" aria-pressed="' + (i === ui.guideStep) + '">' + (i + 1) + ' ' + esc(x.tab) + '</button>';
      }).join('') + '</div>' +
      '<div class="sec-head"><h2 class="sec-title disp" id="h-guide">' + esc(g.title) + '</h2></div>' +
      (g.qr ? qrBoard() : '') +
      '<ul class="guide-list">' + g.items.map(function (it) {
        return '<li class="guide-item"><span class="guide-ic">' + icon(it.icon, 20) + '</span><div class="guide-text"><h3>' + esc(it.title) + '</h3><p>' + nb(it.desc) + '</p>' +
          (it.link ? '<a class="link" href="' + esc(it.link.url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.link.label) + icon('ext', 14) + '</a>' : '') +
          '</div></li>';
      }).join('') + '</ul>' +
      (g.tip ? '<p class="note note-' + g.tip.tone + '">' + icon('warn', 20) + '<span><span class="note-title">' + esc(g.tip.title) + '</span>' + nb(g.tip.desc) + '</span></p>' : '') +
      (next ? '<div class="guide-nav"><button type="button" class="arrowbtn" data-act="guideNext" data-arg="' + (ui.guideStep + 1) + '" data-key="guide-next">' +
        icon('arrow', 24) + '<span class="sr">다음: ' + esc(next.title) + '</span></button></div>' : '') +
      '</section>');

    h.push('<section class="sec" aria-labelledby="h-allow"><div class="sec-head"><h2 class="sec-title disp" id="h-allow">한국에 들어올 때 면세한도</h2></div>' +
      '<div class="panel"><dl class="allow">' + D.allowance.map(function (x) { return '<div><dt>' + esc(x.label) + '</dt><dd>' + esc(x.value) + '</dd></div>'; }).join('') + '</dl>' +
      '<p class="lede">1인 기준입니다.</p></div></section>');

    h.push('<section class="sec" aria-labelledby="h-src"><div class="sec-head"><h2 class="sec-title disp" id="h-src">근거 자료</h2><span class="sec-side">' + esc(D.sourcesCheckedAt) + ' 확인</span></div>' +
      '<ul class="sources">' + D.sources.map(function (x) {
        return '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer">' + esc(x.label) + icon('ext', 14) + '</a></li>';
      }).join('') + '</ul></section>');

    return h.join('');
  }

  var VIEWS = { home: viewHome, receipts: viewReceipts, calendar: viewCalendar, departure: viewDeparture, guide: viewGuide };

  /* ---------- 그리기 ---------- */
  function renderChrome(c) {
    $('#tripchip').innerHTML = c.trip.depDate
      ? '<span class="sr">여행 정보 </span>' + esc(c.airport.short) + ' <span class="num">' + esc(c.dlabel) + '</span>'
      : '여행 정보 입력';

    var bar = $('#previewbar');
    if (ui.preview === 'auto' || !c.trip.depDate) {
      bar.hidden = true;
    } else {
      bar.hidden = false;
      $('#previewtext').textContent = '미리보기: ' + D.phases[ui.preview].chip + ' 시점의 화면';
    }

    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      if (tabs[i].getAttribute('data-arg') === ui.tab) tabs[i].setAttribute('aria-current', 'page');
      else tabs[i].removeAttribute('aria-current');
    }
  }

  function render() {
    var active = document.activeElement;
    var key = active && active.getAttribute ? active.getAttribute('data-key') : '';
    var c = context();
    $('#view').innerHTML = VIEWS[ui.tab](c);
    renderChrome(c);
    if (key) {
      /* 다시 그린 뒤에도 방금 누른 버튼에 포커스가 남게 */
      var again = document.querySelector('[data-key="' + key + '"]');
      if (again && again !== document.activeElement) {
        try { again.focus({ preventScroll: true }); } catch (e) { again.focus(); }
      }
    }
  }

  function tabFromHash() {
    var h = String(window.location.hash || '').replace('#', '');
    return TABS.indexOf(h) >= 0 ? h : '';
  }

  function go(tab, fromHash) {
    if (TABS.indexOf(tab) < 0) tab = 'home';
    var view = $('#view');
    var inside = view.contains(document.activeElement);
    ui.tab = tab;
    if (!fromHash) {
      try {
        if (window.location.hash !== '#' + tab) window.location.hash = tab;
      } catch (e) {
        /* 주소를 바꿀 수 없는 환경에서는 화면만 바꿉니다 */
      }
    }
    render();
    view.scrollTop = 0;
    if (inside && !view.contains(document.activeElement)) {
      try { view.focus({ preventScroll: true }); } catch (e) { view.focus(); }
    }
  }

  function toast(text, label, act) {
    var t = $('#toast');
    t.innerHTML = '<span>' + esc(text) + '</span>' +
      (label ? '<button type="button" class="btn-text" data-act="' + act + '">' + esc(label) + '</button>' : '');
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () { t.innerHTML = ''; }, label ? 7000 : 3200);
  }

  /* ---------- 입력 시트 공통 ---------- */
  function openDlg(d) {
    try {
      if (typeof d.showModal === 'function') { if (!d.open) d.showModal(); } else d.setAttribute('open', '');
    } catch (e) {
      d.setAttribute('open', '');
    }
  }

  function closeDlg(d) {
    if (!d) return;
    try {
      if (typeof d.close === 'function') d.close(); else d.removeAttribute('open');
    } catch (e) {
      d.removeAttribute('open');
    }
  }

  function fail(msgEl, text, focusSel) {
    msgEl.textContent = text;
    var el = $(focusSel);
    if (el) el.focus();
    return false;
  }

  function indexOfReceipt(id) {
    for (var i = 0; i < state.receipts.length; i++) if (state.receipts[i].id === id) return i;
    return -1;
  }

  /* ---------- 영수증 입력 시트 (추가·수정) ----------
     ui.form에 지금 시트에서 작업 중인 내용을 둡니다.
     editId가 있으면 그 영수증을 수정하고, 없으면 새로 추가합니다.
     물품 금액(price)은 입력한 글자 그대로 들고 있다가 저장할 때 숫자로 바꿉니다. */
  function blankItem() { return { id: uid(), name: '', price: '', used: false }; }

  /* 시트에 지금 들어 있는 결제 금액 (물품별 입력이면 물품 금액의 합) */
  function formTotal() {
    if (ui.form.mode !== 'items') return toInt($('#r-total').value);
    var sum = 0;
    ui.form.items.forEach(function (it) { sum += toInt(it.price); });
    return sum;
  }

  function renderFormItems() {
    $('#r-items').innerHTML = ui.form.items.map(function (it, i) {
      var n = i + 1;
      return '<li class="item-row">' +
        '<input class="input" id="it-name-' + i + '" data-item="' + i + '" data-field="name" type="text" maxlength="30" autocomplete="off" placeholder="물품 이름" aria-label="물품 ' + n + ' 이름" value="' + esc(it.name) + '">' +
        '<input class="input num" id="it-price-' + i + '" data-item="' + i + '" data-field="price" type="text" inputmode="numeric" autocomplete="off" placeholder="금액" aria-label="물품 ' + n + ' 금액" value="' + esc(it.price) + '">' +
        '<button type="button" class="iconbtn" data-act="formDelItem" data-arg="' + i + '" aria-label="물품 ' + n + ' 삭제">' + icon('close', 20) + '</button></li>';
    }).join('');
    $('#r-add-item').hidden = ui.form.items.length >= MAX_ITEMS;
  }

  /* 입력 방식(합계만 / 물품별)과 추가·수정에 맞춰 시트의 겉모습을 맞춥니다 */
  function syncForm() {
    var itemsMode = ui.form.mode === 'items';
    $('#r-total-field').hidden = itemsMode;
    $('#r-items-field').hidden = !itemsMode;
    $('#r-mode-total').setAttribute('aria-pressed', String(!itemsMode));
    $('#r-mode-items').setAttribute('aria-pressed', String(itemsMode));
    $('#dlg-receipt-title').textContent = ui.form.editId ? '영수증 수정' : '영수증 추가';
    $('#r-submit').textContent = ui.form.editId ? '수정 저장' : '영수증 저장';
  }

  /* 금액을 넣는 동안 면세 대상인지 바로 계산해서 보여 줍니다 */
  function updateCalc() {
    var itemsMode = ui.form.mode === 'items';
    var total = formTotal();
    var rate = +$('#r-rate').value === 8 ? 8 : 10;
    var date = $('#r-date').value;
    var box = $('#r-calc');
    if (itemsMode) $('#r-items-sum').textContent = '합계 ' + yen(total);
    if (!total) {
      box.innerHTML = '<p class="calc-sub">' + (itemsMode ? '물품 금액을 넣으면' : '금액을 넣으면') + ' 면세 대상인지 바로 계산합니다.</p>';
      return;
    }
    var v = L.receiptView({ total: total, rate: rate, fee: toInt($('#r-fee').value), date: isISO(date) ? date : L.toISO(new Date()), consumed: false }, D.rules, '');
    if (!v.eligible) {
      var pct = Math.min(100, Math.round(v.pre * 100 / D.rules.minPreTax));
      box.innerHTML = '<p><b>아직 면세 대상이 아닙니다.</b> 세전 ' + yen(v.pre) + '이라 ' + yen(D.rules.minPreTax - v.pre) + ' 더 담아야 합니다.</p>' +
        '<div class="meter"><span style="width:' + pct + '%"></span></div>';
    } else {
      box.innerHTML = '<p>환급 예상<b class="calc-big">' + yen(v.net) + '</b></p>' +
        '<p class="calc-sub">세전 ' + yen(v.pre) + ', 출국 기한 ' + ymd(v.due) + '까지</p>' +
        '<div class="meter is-ok"><span style="width:100%"></span></div>';
    }
  }

  /* 스캔(OCR)을 붙일 때는 서버가 돌려준 결과를 이 함수에 넘기면 입력칸이 채워집니다.
     data = { store: '매장 이름', date: 'YYYY-MM-DD', total: 세금 포함 합계, tax: 소비세,
              items: [{ name: '물품 이름', price: 세금 포함 금액 }] }  (items가 있으면 물품별 입력으로 채움) */
  function fillReceiptForm(data) {
    if (!data) return;
    if (data.store) $('#r-store').value = String(data.store).slice(0, 40);
    if (isISO(data.date)) $('#r-date').value = data.date;
    if (Array.isArray(data.items) && data.items.length) {
      ui.form.mode = 'items';
      ui.form.items = data.items.slice(0, MAX_ITEMS).map(function (it) {
        var price = toInt(it && it.price);
        return { id: uid(), name: String((it && it.name) || '').slice(0, 30), price: price ? String(price) : '', used: false };
      });
    } else if (data.total) {
      ui.form.mode = 'total';
      $('#r-total').value = String(toInt(data.total));
    }
    if (data.total && data.tax) {
      /* 세액 비율이 8%에 가까우면 식품·음료로 봅니다 */
      var ratio = toInt(data.tax) / Math.max(1, toInt(data.total) - toInt(data.tax));
      $('#r-rate').value = ratio < 0.09 ? '8' : '10';
    }
    renderFormItems();
    syncForm();
    updateCalc();
  }

  /* id를 주면 그 영수증을 수정하는 시트, 없으면 새 영수증 시트 */
  function openReceipt(id) {
    var today = L.toISO(new Date());
    var i = id ? indexOfReceipt(id) : -1;
    var r = i >= 0 ? state.receipts[i] : null;
    $('#form-receipt').reset();
    $('#r-date').max = today;
    $('#r-msg').textContent = '';
    if (r) {
      ui.form = {
        editId: r.id,
        mode: r.mode,
        items: r.items.map(function (it) { return { id: it.id, name: it.name, price: String(it.price), used: it.used }; })
      };
      $('#r-store').value = r.store;
      $('#r-date').value = r.date;
      $('#r-rate').value = String(r.rate);
      $('#r-total').value = String(r.total);
      $('#r-method').value = r.method;
      $('#r-fee').value = r.fee ? String(r.fee) : '';
    } else {
      ui.form = { editId: '', mode: 'total', items: [] };
      $('#r-date').value = today;
    }
    renderFormItems();
    syncForm();
    updateCalc();
    openDlg($('#dlg-receipt'));
    if (!r) $('#r-store').focus();
  }

  function submitReceipt(e) {
    e.preventDefault();
    var f = ui.form;
    var store = $('#r-store').value.trim();
    var date = $('#r-date').value;
    var rate = +$('#r-rate').value === 8 ? 8 : 10;
    var msg = $('#r-msg');
    var items = [];
    var total = 0;
    var i;

    if (!store) return fail(msg, '매장 이름을 넣어 주세요.', '#r-store');
    if (!isISO(date)) return fail(msg, '구매일을 골라 주세요.', '#r-date');
    if (date > L.toISO(new Date())) return fail(msg, '구매일이 오늘보다 뒤입니다. 날짜를 확인해 주세요.', '#r-date');

    if (f.mode === 'items') {
      for (i = 0; i < f.items.length; i++) {
        var name = String(f.items[i].name || '').trim();
        var price = toInt(f.items[i].price);
        if (!name && !price) continue;   // 빈 줄은 건너뜀
        if (!price) return fail(msg, '‘' + name + '’의 금액을 숫자로 넣어 주세요.', '#it-price-' + i);
        items.push({ id: f.items[i].id, name: name || '물품 ' + (items.length + 1), price: price, used: !!f.items[i].used });
        total += price;
      }
      if (!items.length) return fail(msg, '물품을 하나 이상 넣어 주세요.', '#it-name-0');
    } else {
      total = toInt($('#r-total').value);
      if (!total) return fail(msg, '결제 금액을 숫자로 넣어 주세요.', '#r-total');
    }
    if (L.preTaxOf(total, rate) < D.rules.minPreTax) {
      return fail(msg, '세전 ' + yen(D.rules.minPreTax) + ' 미만이라 면세 영수증으로 저장할 수 없습니다.', f.mode === 'items' ? '#r-add-item' : '#r-total');
    }

    var idx = f.editId ? indexOfReceipt(f.editId) : -1;
    var old = idx >= 0 ? state.receipts[idx] : null;
    /* 합계 방식으로 저장할 때의 소비 표시: 원래 표시를 그대로 잇습니다 */
    var consumed = !!old && (old.mode === 'total' ? old.consumed : f.items.some(function (it) { return !!it.used; }));
    var next = cleanReceipt({
      id: old ? old.id : uid(),
      store: store, date: date, mode: f.mode, total: total, rate: rate,
      method: $('#r-method').value, fee: toInt($('#r-fee').value),
      consumed: consumed, items: items
    });
    /* 합계 방식에서 소비로 표시해 둔 영수증을 물품별로 바꾸면 어느 물품인지 알 수 없어 표시가 풀립니다 */
    var lost = !!old && old.mode === 'total' && old.consumed && next.mode === 'items';

    if (old) state.receipts[idx] = next; else state.receipts.push(next);
    save();
    closeDlg($('#dlg-receipt'));
    if (old && ui.tab === 'receipts') render(); else go('receipts');
    toast(lost ? '수정한 내용을 저장했습니다. 먹었거나 쓴 물건은 물품에서 다시 체크해 주세요.'
      : old ? '수정한 내용을 저장했습니다.' : '영수증을 저장했습니다.');
    return true;
  }

  /* 물품 칸에 글자를 넣을 때마다 작업 중인 내용에 반영 */
  function onFormInput(e) {
    var el = e.target;
    var idx = el && el.getAttribute ? el.getAttribute('data-item') : null;
    if (idx !== null && ui.form.items[+idx]) {
      ui.form.items[+idx][el.getAttribute('data-field') === 'price' ? 'price' : 'name'] = el.value;
    }
    updateCalc();
  }

  /* 물품 칸에서 Enter: 이름 → 금액 → 다음 줄(마지막 줄이면 새 줄)로 이동. 한글 조합 중에는 건드리지 않음 */
  function onItemKey(e) {
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    var el = e.target;
    var idx = el && el.getAttribute ? el.getAttribute('data-item') : null;
    if (idx === null) return;
    e.preventDefault();
    var target;
    if (el.getAttribute('data-field') === 'name') target = $('#it-price-' + idx);
    else if (+idx < ui.form.items.length - 1) target = $('#it-name-' + (+idx + 1));
    else { ACT.formAddItem(); return; }
    if (target) target.focus();
  }

  /* ---------- 여행 정보 시트 ---------- */
  function openTrip() {
    $('#t-airport').value = state.trip.airport;
    $('#t-date').value = state.trip.depDate;
    $('#t-time').value = state.trip.depTime;
    $('#t-msg').textContent = '';
    openDlg($('#dlg-trip'));
  }

  function submitTrip(e) {
    e.preventDefault();
    var date = $('#t-date').value;
    var time = $('#t-time').value;
    var msg = $('#t-msg');
    if (!isISO(date)) return fail(msg, '출국일을 골라 주세요.', '#t-date');
    if (!isTime(time)) return fail(msg, '출발 시각을 넣어 주세요.', '#t-time');
    state.trip = { airport: airportOf($('#t-airport').value).id, depDate: date, depTime: time, lead: state.trip.lead || 0 };
    ui.preview = 'auto';
    ui.calMonth = '';
    ui.calDay = '';
    save();
    closeDlg($('#dlg-trip'));
    render();
    toast('여행 정보를 저장했습니다.');
    return true;
  }

  /* ---------- 알림 일정 내보내기 ---------- */
  function exportRem() {
    var c = context();
    if (!c.rem.length) { toast('먼저 여행 정보를 입력해 주세요.'); return; }

    if (ui.embedded) {
      /* 다른 페이지 안에 끼워진 화면에서는 파일 저장이 막혀 있어 글자로 복사합니다 */
      var text = ['[면세 알림 일정]'].concat(c.rem.map(function (r) { return mdw(L.toISO(r.at)) + ' ' + hm(r.at) + ' ' + r.title; })).join('\n');
      var sorry = '복사하지 못했습니다. 일정을 길게 눌러 직접 복사해 주세요.';
      try {
        navigator.clipboard.writeText(text).then(function () { toast('알림 일정을 복사했습니다.'); }, function () { toast(sorry); });
      } catch (e) {
        toast(sorry);
      }
      return;
    }

    try {
      var blob = new Blob([L.toICS(c.rem, new Date())], { type: 'text/calendar;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'taxgo.ics';
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      toast('캘린더 파일을 저장했습니다. 파일을 열어 캘린더에 추가하세요.');
    } catch (e) {
      toast('파일을 저장하지 못했습니다.');
    }
  }

  /* ---------- 버튼 동작 (data-act="이름") ---------- */
  function shiftMonth(n) {
    var cur = ui.calMonth || L.toISO(now()).slice(0, 7);
    var d = new Date(+cur.slice(0, 4), +cur.slice(5, 7) - 1 + n, 1, 12);
    ui.calMonth = d.getFullYear() + '-' + L.pad(d.getMonth() + 1);
    ui.calDay = '';
    render();
  }

  function focusEl(sel) {
    var el = $(sel);
    if (el) el.focus();
  }

  var ACT = {
    tab: function (arg) { go(arg); },
    add: function () { openReceipt(''); },
    edit: function (id) { openReceipt(id); },
    trip: function () { openTrip(); },
    close: function (arg) { closeDlg(document.getElementById(arg)); },

    /* 영수증 시트: 입력 방식 바꾸기 */
    formMode: function (arg) {
      var next = arg === 'items' ? 'items' : 'total';
      if (next === ui.form.mode) return;
      if (next === 'items') {
        if (!ui.form.items.length) ui.form.items.push(blankItem());
      } else {
        /* 물품별로 넣던 금액이 있으면 합계 칸에 그대로 옮겨 줍니다 */
        var sum = formTotal();
        if (sum) $('#r-total').value = String(sum);
      }
      ui.form.mode = next;
      $('#r-msg').textContent = '';
      renderFormItems();
      syncForm();
      updateCalc();
      focusEl(next === 'items' ? '#it-name-0' : '#r-total');
    },

    formAddItem: function () {
      if (ui.form.items.length >= MAX_ITEMS) return;
      ui.form.items.push(blankItem());
      renderFormItems();
      updateCalc();
      focusEl('#it-name-' + (ui.form.items.length - 1));
    },

    formDelItem: function (arg) {
      var i = toInt(arg);
      ui.form.items.splice(i, 1);
      if (!ui.form.items.length) ui.form.items.push(blankItem());
      renderFormItems();
      updateCalc();
      focusEl('#it-name-' + Math.min(i, ui.form.items.length - 1));
    },

    /* 합계만 넣은 영수증: 영수증 단위로 소비 표시 */
    consume: function (id) {
      var i = indexOfReceipt(id);
      if (i < 0) return;
      state.receipts[i].consumed = !state.receipts[i].consumed;
      save();
      render();
    },

    del: function (id) {
      var i = indexOfReceipt(id);
      if (i < 0) return;
      ui.undo = { r: state.receipts[i], i: i };
      state.receipts.splice(i, 1);
      save();
      render();
      toast('영수증을 삭제했습니다.', '되돌리기', 'undo');
    },

    undo: function () {
      if (!ui.undo) return;
      state.receipts.splice(Math.min(ui.undo.i, state.receipts.length), 0, ui.undo.r);
      ui.undo = null;
      save();
      render();
      toast('영수증을 되돌렸습니다.');
    },

    preview: function (arg) {
      ui.preview = arg;
      ui.calMonth = '';
      ui.calDay = '';
      ui.flip = ui.tab === 'home';
      render();
      ui.flip = false;
      if (ui.tab === 'home') $('#view').scrollTop = 0;
    },

    /* 공항 도착 목표: 0이면 자동, 아니면 출발 몇 시간 전인지 직접 고름 */
    lead: function (arg) {
      var hours = toInt(arg);
      state.trip.lead = hours >= A.baseHours && hours <= A.maxHours ? hours : 0;
      save();
      render();
    },

    calPrev: function () { shiftMonth(-1); },
    calNext: function () { shiftMonth(1); },
    calDay: function (iso) { ui.calDay = iso; render(); },
    calGo: function (iso) {
      if (!isISO(iso)) return;
      ui.calMonth = iso.slice(0, 7);
      ui.calDay = iso;
      render();
      $('#view').scrollTop = 0;
    },

    guide: function (arg) { ui.guideStep = Math.max(0, Math.min(D.guide.length - 1, toInt(arg))); render(); },
    /* 화살표로 다음 단계에 가면 그 단계의 맨 위부터 보이게 (아래쪽에서 눌렀으니 그대로 두면 새 단계 중간에 떨어짐) */
    guideNext: function (arg) { ACT.guide(arg); $('#view').scrollTop = 0; },
    depTab: function (arg) {
      ui.depTab = DEP_TABS.some(function (x) { return x[0] === arg; }) ? arg : 'steps';
      render();
    },
    exportRem: exportRem,
    clearChecks: function () { state.checks = {}; save(); render(); },

    startMine: function () {
      state = emptyState();
      ui.preview = 'auto';
      ui.calMonth = '';
      ui.calDay = '';
      save();
      render();
      openTrip();
    },

    resetSample: function () {
      try {
        window.localStorage.removeItem(STORE_KEY);
        window.localStorage.removeItem(OLD_STORE_KEY);
      } catch (e) {
        /* 저장소를 못 쓰는 환경 */
      }
      state = sampleState();
      ui.preview = 'auto';
      ui.calMonth = '';
      ui.calDay = '';
      closeDlg($('#dlg-trip'));
      render();
      toast('예시 데이터로 되돌렸습니다.');
    }
  };

  /* ---------- 이벤트 연결 ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var fn = ACT[el.getAttribute('data-act')];
    if (!fn) return;
    if (el.tagName === 'A') e.preventDefault();
    fn(el.getAttribute('data-arg') || '', el);
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    var kind = el && el.getAttribute ? el.getAttribute('data-change') : '';
    if (kind === 'check') {
      var i = toInt(el.getAttribute('data-arg'));
      if (el.checked) state.checks[i] = true; else delete state.checks[i];
      save();
      render();
    } else if (kind === 'airport') {
      state.trip.airport = airportOf(el.value).id;
      save();
      render();
    } else if (kind === 'itemUsed') {
      /* 물품별 영수증에서 물품 하나를 소비로 체크하거나 풀기 (data-arg = '영수증id:물품id') */
      var parts = String(el.getAttribute('data-arg') || '').split(':');
      var ri = indexOfReceipt(parts[0]);
      if (ri < 0) return;
      var r = state.receipts[ri];
      r.items.forEach(function (it) { if (it.id === parts[1]) it.used = !!el.checked; });
      save();
      render();
    }
  });

  $('#form-receipt').addEventListener('input', onFormInput);
  $('#form-receipt').addEventListener('change', updateCalc);
  $('#form-receipt').addEventListener('submit', submitReceipt);
  $('#r-items').addEventListener('keydown', onItemKey);
  $('#form-trip').addEventListener('submit', submitTrip);

  ['#dlg-receipt', '#dlg-trip'].forEach(function (sel) {
    var d = $(sel);
    /* 시트 바깥(어두운 부분)을 누르면 닫기 */
    d.addEventListener('click', function (e) { if (e.target === d) closeDlg(d); });
  });

  window.addEventListener('hashchange', function () {
    var t = tabFromHash();
    if (t && t !== ui.tab) go(t, true);
  });

  /* ---------- 시작 ---------- */
  $('#r-method').innerHTML = D.methods.map(function (x) { return '<option value="' + x.id + '">' + esc(x.label) + '</option>'; }).join('');
  $('#t-airport').innerHTML = D.airports.map(function (x) { return '<option value="' + x.id + '">' + esc(x.name) + '</option>'; }).join('');
  ui.tab = tabFromHash() || 'home';
  render();

  /* 스캔 기능을 붙일 때 쓰는 연결점 */
  window.MYGO_APP = { fillReceiptForm: fillReceiptForm, openReceipt: openReceipt };
})();
</script>
</body>
</html>
